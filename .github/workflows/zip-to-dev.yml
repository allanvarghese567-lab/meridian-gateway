name: zip-to-dev

on:
  push:
    branches: [zipfile]
    paths: ["uploads/*.zip"]

permissions:
  contents: write

concurrency:
  group: zip-to-dev
  cancel-in-progress: false

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest
    env:
      HAS_PUSH_TOKEN: ${{ secrets.PUSH_TOKEN != '' }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Unzip upload and push to dev
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000

          # 1. Find the zip added in this push
          if [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            FILES=$(git ls-files 'uploads/*.zip')
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'uploads/*.zip')
          fi
          ZIP=$(printf '%s\n' "$FILES" | sed '/^$/d' | tail -n1)
          if [ -z "$ZIP" ]; then echo "No zip changed. Nothing to do."; exit 0; fi
          echo "Using zip: $ZIP"

          # 2. Unzip (use the single top-level folder if there is one)
          EX=$(mktemp -d)
          unzip -q "$ZIP" -d "$EX"
          rm -rf "$EX/__MACOSX"
          SRC="$EX"
          if [ "$(ls -A "$EX" | wc -l)" = "1" ] && [ -d "$EX/$(ls -A "$EX")" ]; then
            SRC="$EX/$(ls -A "$EX")"
          fi

          # 3. Prepare dev branch (create it if missing)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DEV=$(mktemp -d)
          git fetch origin dev 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            git worktree add -B dev "$DEV" origin/dev
          else
            git worktree add --detach "$DEV"
            git -C "$DEV" checkout --orphan dev
            git -C "$DEV" rm -rf -q . || true
          fi

          # 4. Mirror zip contents onto dev
          KEEP=""
          if [ "$HAS_PUSH_TOKEN" != "true" ]; then
            echo "PUSH_TOKEN not set: leaving .github/workflows on dev unchanged."
            if [ -d "$DEV/.github/workflows" ]; then
              KEEP=$(mktemp -d); cp -a "$DEV/.github/workflows/." "$KEEP/"
            fi
          fi
          find "$DEV" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SRC"/. "$DEV"/
          if [ "$HAS_PUSH_TOKEN" != "true" ]; then
            rm -rf "$DEV/.github/workflows"
            if [ -n "$KEEP" ]; then
              mkdir -p "$DEV/.github/workflows"; cp -a "$KEEP/." "$DEV/.github/workflows/"
            fi
            rmdir "$DEV/.github" 2>/dev/null || true
          fi

          # 5. Commit and push
          cd "$DEV"
          git add -A
          if git diff --cached --quiet; then echo "dev already matches the zip."; exit 0; fi
          git commit -q -m "Import $(basename "$ZIP") from zipfile branch ($GITHUB_SHA)"
          git push origin dev
